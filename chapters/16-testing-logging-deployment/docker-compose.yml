# ============================================================
# Docker Compose — App + PostgreSQL
# Run: docker-compose up --build
# ============================================================

version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiryana
      POSTGRES_PASSWORD: kiryana123
      POSTGRES_DB: kiryana_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Node.js Application
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kiryana:kiryana123@db:5432/kiryana_store?schema=public
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: change-this-to-a-random-secret
    ports:
      - "3000:3000"
    depends_on:
      - db
    # Run migrations before starting
    command: >
      sh -c "npx prisma migrate deploy && node src/server.js"

volumes:
  postgres_data:
